<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />

		<title>Chat App</title>

		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet" />

		<link
			rel="stylesheet"
			href="../src/css/style.css" />

		<script
			defer
			src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
	</head>
	<body>
		<div class="app">
			<nav class="nav-rail">
				<a
					class="nav-rail__logo"
					href="#">
					<svg class="icon--large">
						<use href="../src/assets/icons/ui_icons_sprite.svg#chat"></use>
					</svg>
				</a>

				<button
					class="nav-item nav-item--active"
					id="nav-chats">
					<svg class="icon--medium">
						<use href="../src/assets/icons/ui_icons_sprite.svg#chat"></use>
					</svg>

					<span class="nav-item__badge nav-item__badge--count">3</span>
				</button>

				<button
					class="nav-item"
					id="nav-bookmarks">
					<svg class="icon--medium">
						<use
							href="../src/assets/icons/ui_icons_sprite.svg#bookmark"></use>
					</svg>
				</button>

				<button
					class="nav-item"
					id="nav-call">
					<svg class="icon--medium">
						<use href="../src/assets/icons/ui_icons_sprite.svg#call"></use>
					</svg>
				</button>

				<button
					class="nav-item"
					id="nav-video">
					<svg class="icon--medium">
						<use
							href="../src/assets/icons/ui_icons_sprite.svg#video-call"></use>
					</svg>
				</button>

				<div class="nav-rail__spacer"></div>

				<button
					class="nav-item"
					id="nav-settings">
					<svg class="icon--medium">
						<use
							href="../src/assets/icons/ui_icons_sprite.svg#settings"></use>
					</svg>
				</button>

				<div class="nav-rail__user">
					<img
						src="https://i.pravatar.cc/40?img=12"
						alt="Himanshu Sorathiya" />
				</div>
			</nav>

			<div class="chat-layout">
				<aside class="sidebar">
					<div class="sidebar__header">
						<h1 class="sidebar__title">Chat</h1>

						<button
							class="icon-btn icon-btn--sm"
							id="btn-sidebar-settings">
							<svg class="icon--small">
								<use
									href="../src/assets/icons/ui_icons_sprite.svg#settings"></use>
							</svg>
						</button>
					</div>

					<div class="own-profile"></div>

					<div class="search-bar">
						<input
							type="search"
							id="chat-search"
							class="search-bar__input"
							placeholder="Search" />

						<span class="search-bar__icon">
							<svg class="icon--small">
								<use
									href="../src/assets/icons/ui_icons_sprite.svg#search"></use>
							</svg>
						</span>
					</div>

					<div class="conv-section">
						<div class="conv-section__header">
							<span class="conv-section__label">Last chats</span>

							<div class="conv-section__actions">
								<button
									class="icon-btn icon-btn--sm"
									id="btn-new-chat">
									<svg class="icon--small">
										<use
											href="../src/assets/icons/ui_icons_sprite.svg#plus"></use>
									</svg>
								</button>

								<button
									class="icon-btn icon-btn--sm"
									id="btn-list-more">
									<svg class="icon--small">
										<use
											href="../src/assets/icons/ui_icons_sprite.svg#ellipsis-vertical"></use>
									</svg>
								</button>
							</div>
						</div>

						<ul
							class="conv-section__list"
							id="conv-list"></ul>
					</div>
				</aside>

				<main
					class="chat-area"
					id="chat-panel">
					<div class="chat-header">
						<div class="chat-header__info">
							<div class="avatar avatar--sm">
								<img
									src=""
									alt="" />
							</div>

							<div class="chat-header__text">
								<p
									class="chat-header__title"
									id="chat-title"></p>

								<p
									class="chat-header__sub"
									id="chat-subtitle"></p>
							</div>
						</div>

						<div class="chat-header__actions">
							<button
								class="icon-btn"
								id="btn-search">
								<svg class="icon--small">
									<use
										href="../src/assets/icons/ui_icons_sprite.svg#search"></use>
								</svg>
							</button>

							<button
								class="icon-btn"
								id="btn-call">
								<svg class="icon--small">
									<use
										href="../src/assets/icons/ui_icons_sprite.svg#call"></use>
								</svg>
							</button>

							<button
								class="icon-btn"
								id="btn-videocall">
								<svg class="icon--small">
									<use
										href="../src/assets/icons/ui_icons_sprite.svg#video-call"></use>
								</svg>
							</button>

							<button
								class="icon-btn"
								id="btn-more">
								<svg class="icon--small">
									<use
										href="../src/assets/icons/ui_icons_sprite.svg#ellipsis-vertical"></use>
								</svg>
							</button>
						</div>
					</div>

					<div
						class="chat-body"
						id="chat-body"></div>

					<div class="chat-input">
						<div class="input-row">
							<input
								type="text"
								id="msg-input"
								class="input-row__field"
								placeholder="Write your message..." />

							<button
								class="send-btn"
								id="btn-send">
								<svg class="icon--small">
									<use
										href="../src/assets/icons/ui_icons_sprite.svg#send"></use>
								</svg>
							</button>
						</div>
					</div>
				</main>

				<section class="panel"></section>
			</div>
		</div>

		<script
			defer
			type="module"
			src="../dist/scripts/script.js"></script>
		<script
			defer
			type="module"
			src="../dist/scripts/setVariable.js"></script>
	</body>
</html>
